<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>外贸单证 Agent Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>外贸单证 Agent</h1>
        </div>
        <div class="status-pill" id="serverStatus">准备中</div>
      </header>

      <section class="workspace">
        <aside class="panel source-panel">
          <div class="panel-head">
            <h2>资料</h2>
            <div class="button-group">
              <button class="icon-button" id="refreshCases" title="刷新资料目录" aria-label="刷新资料目录">↻</button>
              <button class="icon-button sidebar-toggle" id="toggleSidebar" title="收起资料栏" aria-label="收起资料栏">‹</button>
            </div>
          </div>
          <nav class="source-nav" aria-label="资料栏">
            <button class="source-nav-button active" type="button" data-source-view="import">导入</button>
            <button class="source-nav-button" type="button" data-source-view="history">
              历史
              <span class="source-nav-count" id="historyCount">0</span>
            </button>
          </nav>

          <div class="source-view active" id="sourceViewImport">
            <details class="draft-import-panel" id="draftImportPanel">
              <summary>整理稿导入</summary>
              <div class="import-box">
                <label class="input-label" for="draftFile">上传整理稿 JSON 文件</label>
                <input id="draftFile" type="file" accept=".json,.txt,.md" />
                <label class="input-label" for="draftText">或粘贴整理稿 JSON</label>
                <textarea id="draftText" placeholder="粘贴 trade-doc-summary-extractor 输出的 JSON"></textarea>
                <button id="importDraftButton">导入整理稿</button>
                <div class="source-note" id="importStatus">支持 shipment_groups、fields、items 和 packing_lines。</div>
              </div>
            </details>
            <label class="input-label" for="folderInput">资料目录</label>
            <div class="path-row">
              <input id="folderInput" type="text" />
              <button id="scanButton">扫描</button>
            </div>
            <div class="case-list" id="caseList"></div>

            <h3>文件分类</h3>
            <div class="file-list" id="fileList"></div>
          </div>

          <div class="source-view" id="sourceViewHistory">
            <div class="history-toolbar">
              <input id="historySearch" type="search" placeholder="搜索单号或文件名" aria-label="搜索历史" />
              <button id="clearHistoryButton" type="button">清空</button>
            </div>
            <div class="history-list" id="historyList"></div>
          </div>
        </aside>

        <section class="panel review-panel">
          <div class="panel-head">
            <h2>核验</h2>
            <div class="button-group">
              <button id="saveButton" class="save-button" type="button" disabled>保存</button>
              <button id="validateButton">校验</button>
              <div class="export-menu-wrap">
                <button id="exportButton" class="primary" type="button">导出</button>
                <div class="export-menu" id="exportMenu" hidden>
                  <button type="button" data-export-kind="pipkg">导出 PIPKG</button>
                  <button type="button" data-export-kind="si">导出 SI</button>
                </div>
              </div>
            </div>
          </div>

          <div class="summary-grid" id="caseSummary"></div>

          <details class="reconciliation-panel" id="reconciliationPanel" open>
            <summary>提单差异核对</summary>
            <div class="reconciliation-grid" id="reconciliationGrid"></div>
          </details>

          <div class="tabs" role="tablist">
            <button class="tab" data-tab="groups">拆单</button>
            <button class="tab active" data-tab="fields">基础信息</button>
            <button class="tab" data-tab="si">SI</button>
            <button class="tab" data-tab="items">PI</button>
            <button class="tab" data-tab="packing">PKG</button>
          </div>

          <div class="tab-panel active" id="tab-fields">
            <div class="field-grid" id="fieldGrid"></div>
          </div>

          <div class="tab-panel" id="tab-groups">
            <div class="group-list" id="groupList"></div>
          </div>

          <div class="tab-panel" id="tab-si">
            <div class="field-grid" id="siGrid"></div>
          </div>

          <div class="tab-panel" id="tab-items">
            <div class="table-wrap">
              <table id="itemsTable">
                <thead>
                  <tr>
                    <th>英文品名</th>
                    <th>中文</th>
                    <th>单价</th>
                    <th>Quantity / m</th>
                    <th>单位</th>
                    <th>总价</th>
                    <th>HS code</th>
                    <th>来源</th>
                    <th class="row-action-col" aria-label="商品行操作">操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <button id="addItem">+ 商品行</button>
          </div>

          <div class="tab-panel" id="tab-packing">
            <div class="table-wrap">
              <table id="packingTable">
                <thead>
                  <tr>
                    <th>品名</th>
                    <th>Quantity / m</th>
                    <th>单位</th>
                    <th>PKGS</th>
                    <th>毛重</th>
                    <th>净重</th>
                    <th>CBM</th>
                    <th>HS code</th>
                    <th class="row-action-col" aria-label="包装行操作">操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <button id="addPacking">+ 包装行</button>
          </div>
        </section>

        <aside class="panel issue-panel">
          <div class="panel-head">
            <h2>问题</h2>
            <span id="issueCount">0</span>
          </div>
          <div class="issue-list" id="issueList"></div>

          <h3>导出</h3>
          <div class="export-box" id="exportBox"><span>尚未导出</span></div>
        </aside>
      </section>
    </main>
    <script src="./exceljs.min.js"></script>
    <script src="./main.js?v=20260818-persistent-edits"></script>
  </body>
</html>
